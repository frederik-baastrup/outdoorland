name: Tjek sitet

# Kør manuelt (Actions → Tjek sitet → Run workflow): henter de vigtigste sider på det rigtige domæne og viser
# status, omdirigeringer, robots og tema – så man kan se, om sitet virker, uden at være logget ind.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Tjek sider
        env:
          DOMAIN: ${{ vars.CHECK_DOMAIN || 'frederikb12.sg-host.com' }}
        shell: bash {0}
        run: |
          B="https://$DOMAIN"
          for p in / /camping/telte/ /8-personers-telt/ /gaskoeleskab/ /luftpistol/ /baalhytte/ /shelter/ /parasol-med-tilt/ /terrassevarmer/ /udendoers-pejs-med-skorsten/ /baby-haengekoeje/ /bedste-luftmadras-test/ /koebsguide/ /viden/ /?s=telt /robots.txt /wp-sitemap.xml; do
            out=$(curl -s -o body.html -w "%{http_code} %{redirect_url} %{time_total}s" --max-time 120 "$B$p")
            theme=$(grep -o 'themes/[a-z0-9_-]*' body.html | head -1)
            robots=$(grep -o '<meta name=.robots.[^>]*>' body.html | head -1)
            prods=$(grep -o '[0-9.]* produkter' body.html | head -1)
            fatal=$(grep -c -i "fatal error\|critical error" body.html); acts=$(grep -c "acts__grid\|season__card" body.html); tests=$(grep -o -i "[^>]\{0,30\}\btest\b[^<]\{0,30\}" body.html | grep -v "http\|-test" | head -2 | tr "\n" " ")
            title=$(grep -o "<title>[^<]*" body.html | head -1)
            echo "$p → $out | $theme | fatal:$fatal | front:$acts | $title | test-ord: $tests"
          done
          echo "--- robots.txt"; curl -s "$B/robots.txt"
          echo "--- www → "; curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" "https://www.$DOMAIN/"
          echo "--- http → "; curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" "http://$DOMAIN/"
